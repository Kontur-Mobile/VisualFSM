name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f236b35da9d031e13b1005234ebe4392ed54c580 # v5.0.0

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          check_name: JUnit test results
          detailed_summary: true
          group_suite: true
          include_time_in_summary: true
          require_tests: true
          fail_on_failure: true
          fail_on_parse_error: true
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-reports-${{ github.run_attempt }}
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14
